[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
pacific = "https://rpc.pharos.xyz"

# Pharosscan (SocialScan) verification. The API key is not a secret: SocialScan accepts any value.
[etherscan]
pacific = { key = "pharos", chain = 1672, url = "https://api.socialscan.io/pharos-mainnet/v1/explorer/command_api/contract" }
